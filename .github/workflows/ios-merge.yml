name: iOS Merge Build

# 在 GitHub 免费的 macOS runner 上完成 Windows 做不了的两步：
#   1. official-addon/build.sh 编译 TurboIOPrivateAddon.dylib（需要 Xcode iOS SDK）
#   2. 嵌入原厂砸壳 IPA 并打包（需要 plutil/codesign 等 macOS 工具）
#
# 两种签名模式：
#   adhoc   —— 产出合并后的 ad-hoc 签名 IPA，回 Windows 用 Sideloadly
#              以自己的 Apple ID（免费或付费）重签安装。推荐先用这个。
#   devcert —— 在 CI 上用开发者证书完整签名（需付费账号 + 3 个 Secrets），
#              产出可直接安装的 TurboIO-local-only.ipa。
#
# 注意：bundle_id 必须与签名描述文件覆盖的 ID 一致，且与最终安装值一致，
# 否则扩展拒绝加载。当前默认值 = 本机 Ad Hoc 描述文件写死的 ID：
#   app.aurora7070.potato6444（Apple Distribution · 团队 2KUJ26BT63
#   · 有效期至 2027-10-03 · 描述文件仅含一台设备）
# 不要用官方 com.rayneo.venus.pub——被雷鸟团队占用，无法签名安装。

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID：默认=你的描述文件写死的 ID，一般不用改；改其它值需换能覆盖它的描述文件'
        required: true
        default: 'app.aurora7070.potato6444'
      signing_mode:
        description: '签名模式'
        type: choice
        default: 'adhoc'
        options:
          - 'adhoc'
          - 'devcert'
      device_udid:
        description: 'iPhone UDID（已按描述文件登记的设备预填；仅 devcert 模式使用）'
        required: false
        default: '00008150-000E021C1E0B401C'
      product:
        description: 'iPhone 机型标识（已按你这台 17 Pro Max 实测的产品类型预填）'
        required: false
        default: 'iPhone18,2'
      enable_amap:
        description: '构建带高德SDK的导航版（联网下载固定版本SDK；入口在 App 的 TurboIO→资料→导航）'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  # 项目 Release 公开的原厂砸壳输入；打包前严格校验哈希
  UPSTREAM_IPA_URL: https://github.com/Turbo1123/Turbo-IO/releases/download/rayneo-ios-1.0.5-201/RayNeo_AI_1.0.5_201_decrypted_original.ipa
  EXPECTED_IPA_SHA256: 39d12aff8f2b312dc3b40ce784a444e52c536e61378434005255177548df966a

jobs:
  merge:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 有实际行为的校验：必错的输入直接失败，不浪费 10 分钟构建
      - name: 校验 Bundle ID 输入
        run: |
          BUNDLE='${{ inputs.bundle_id }}'
          if [[ "$BUNDLE" == "io.turboio.change-me.rayneo" ]]; then
            echo "::error::填了旧占位 Bundle ID。默认值已是证书配套的 app.aurora7070.potato6444，恢复默认即可"
            exit 1
          fi
          if [[ "$BUNDLE" == "com.rayneo.venus.pub" ]]; then
            echo "::error::官方 Bundle ID 被雷鸟团队占用，无法签名安装。请用默认的 app.aurora7070.potato6444"
            exit 1
          fi
          echo "Bundle ID 校验通过：$BUNDLE（签名描述文件覆盖的 ID 为 app.aurora7070.potato6444）"

      - name: 下载高德导航 SDK（固定版本，官方源，校验哈希）
        if: inputs.enable_amap
        run: |
          node official-addon/setup-amap.mjs --accept-sdk-terms

      - name: 编译 TurboIO 扩展 dylib
        run: |
          if [[ "${{ inputs.enable_amap }}" == 'true' ]]; then export TIO_AMAP_ENABLED=1; fi
          bash official-addon/build.sh embedded "${{ inputs.bundle_id }}"
          # 导航版产物在 build/navigation，普通版在 build/embedded
          if [[ -f official-addon/build/navigation/TurboIOPrivateAddon.dylib ]]; then
            echo "ADDON=official-addon/build/navigation/TurboIOPrivateAddon.dylib" >> "$GITHUB_ENV"
          else
            echo "ADDON=official-addon/build/embedded/TurboIOPrivateAddon.dylib" >> "$GITHUB_ENV"
          fi
          echo "使用扩展：$ADDON"

      - name: 下载并校验原厂砸壳 IPA
        run: |
          curl -L --fail -o original.ipa "$UPSTREAM_IPA_URL"
          echo "$EXPECTED_IPA_SHA256  original.ipa" | shasum -a 256 -c -
          rm -rf input && mkdir input
          unzip -q original.ipa -d input
          test -d input/Payload/Runner.app

      # ---------- 模式一：合并 + ad-hoc 签名，回本机用 Sideloadly 重签 ----------
      - name: 合并并打包（ad-hoc）
        if: inputs.signing_mode == 'adhoc'
        run: |
          rm -rf merged && mkdir -p merged
          node official-addon/macho-embed.mjs \
            "$PWD/input/Payload/Runner.app" \
            "$PWD/merged/Payload/Runner.app" \
            "$PWD/$ADDON" \
            "${{ inputs.bundle_id }}"
          # 导航版：复制高德资源 bundle 并补定位用途说明（等价 package.mjs --amap-sdk-root）
          if [[ "${{ inputs.enable_amap }}" == 'true' ]]; then
            node --input-type=module -e "
              import {amapResources,copyAMapResources} from './official-addon/amap-resources.mjs';
              copyAMapResources(amapResources(process.argv[1]), process.argv[2]);
            " "$PWD/official-addon/build/amap-sdk" "$PWD/merged/Payload/Runner.app"
            PLIST="merged/Payload/Runner.app/Info.plist"
            plutil -convert json -o - "$PLIST" | grep -q NSLocationWhenInUseUsageDescription || \
              plutil -insert NSLocationWhenInUseUsageDescription -string '用于用户主动选择的地图定位和前台步行导航。' "$PLIST"
            echo "高德资源已复制（AMap/AMapNavi/AMapSearch.bundle）"
          fi
          # 原厂砸壳包被商店按机型裁剪（列表只到 iPhone16,2），新机型会报
          # DeviceNotSupportedByThinning；把目标机型补进 UISupportedDevices
          PLIST="merged/Payload/Runner.app/Info.plist"
          if plutil -convert json -o - "$PLIST" | grep -q UISupportedDevices \
             && ! plutil -convert json -o - "$PLIST" | grep -q "\"${{ inputs.product }}\""; then
            plutil -insert UISupportedDevices.0 -string "${{ inputs.product }}" "$PLIST"
            echo "已把 ${{ inputs.product }} 加入 UISupportedDevices"
          else
            echo "机型列表已包含 ${{ inputs.product }} 或未裁剪，无需修改"
          fi
          # ad-hoc 签名仅为让包结构完整；最终签名由 Sideloadly 在本机完成
          find merged/Payload/Runner.app/Frameworks -name '*.framework' -type d | while read -r fw; do
            codesign -f -s - "$fw"
          done
          find merged/Payload/Runner.app/Frameworks -name '*.dylib' -type f | while read -r lib; do
            codesign -f -s - "$lib"
          done
          codesign -f -s - --generate-entitlement-der merged/Payload/Runner.app
          ditto -c -k --norsrc --keepParent merged/Payload merged/TurboIO-merged-adhoc.ipa

      - name: 上传合并产物（ad-hoc）
        if: inputs.signing_mode == 'adhoc'
        uses: actions/upload-artifact@v5
        with:
          name: TurboIO-merged-adhoc-ipa
          path: merged/TurboIO-merged-adhoc.ipa
          if-no-files-found: error

      # 签名对账信息：Bundle ID 不一致 = 扩展不加载 / 装不上
      - name: 签名提示（安装前必读）
        if: inputs.signing_mode == 'adhoc'
        run: |
          echo "=============================================="
          echo "IPA 已生成。本包 Bundle ID（已按你的描述文件生成）："
          echo "  ${{ inputs.bundle_id }}"
          echo ""
          echo "爱思助手操作要点："
          echo "  1. 签名方式选「导入证书」，用你的 证书文件.p12 + 描述文件.mobileprovision"
          echo "  2. Bundle ID 保持包内原值，不要修改"
          echo "  3. 目标设备：${{ inputs.device_udid }}（描述文件仅含此一台）"
          echo "  4. 安装后：设置→通用→VPN与设备管理→信任"
          if [[ "${{ inputs.enable_amap }}" == 'true' ]]; then
            echo "  5. 导航版：高德控制台建 iOS 平台 Key 时，绑定 Bundle ID"
            echo "     ${{ inputs.bundle_id }}（不是官方 com.rayneo.venus.pub！）"
            echo "     App内 TurboIO→资料→导航→右上角更多→高德Key设置 填入"
          fi
          echo "=============================================="
          echo "IPA SHA-256："
          shasum -a 256 merged/TurboIO-merged-adhoc.ipa

      # ---------- 模式二：开发者证书完整签名 ----------
      - name: 合并并用开发者证书签名
        if: inputs.signing_mode == 'devcert'
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          test -n "$P12_BASE64"      || { echo '缺少 Secret: IOS_P12_BASE64'; exit 1; }
          test -n "$P12_PASSWORD"    || { echo '缺少 Secret: IOS_P12_PASSWORD'; exit 1; }
          test -n "$PROVISION_BASE64" || { echo '缺少 Secret: IOS_PROVISION_BASE64'; exit 1; }
          test -n "${{ inputs.device_udid }}" || { echo '缺少输入: device_udid'; exit 1; }
          printf '%s' "$P12_BASE64" | python3 -c 'import base64,sys;open("dev.p12","wb").write(base64.b64decode(sys.stdin.read()))'
          printf '%s' "$PROVISION_BASE64" | python3 -c 'import base64,sys;open("dev.mobileprovision","wb").write(base64.b64decode(sys.stdin.read()))'
          security create-keychain -p "" build.keychain-db
          security default-keychain -s build.keychain-db
          security unlock-keychain -p "" build.keychain-db
          security import dev.p12 -k build.keychain-db -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning build.keychain-db | grep -oE '[A-F0-9]{40}' | head -n1)
          test -n "$IDENTITY" || { security find-identity -v -p codesigning; echo '未找到可用的 codesigning 证书'; exit 1; }
          rm -rf signed && mkdir signed
          AMAP_ARGS=()
          if [[ "${{ inputs.enable_amap }}" == 'true' ]]; then
            AMAP_ARGS+=(--amap-sdk-root "$PWD/official-addon/build/amap-sdk")
          fi
          node official-addon/package.mjs \
            --app "$PWD/input/Payload/Runner.app" \
            --addon "$PWD/$ADDON" \
            --profile "$PWD/dev.mobileprovision" \
            --identity "$IDENTITY" \
            --device "${{ inputs.device_udid }}" \
            --bundle "${{ inputs.bundle_id }}" \
            --product "${{ inputs.product }}" \
            "${AMAP_ARGS[@]}" \
            --out "$PWD/signed"

      - name: 上传签名产物（devcert）
        if: inputs.signing_mode == 'devcert'
        uses: actions/upload-artifact@v5
        with:
          name: TurboIO-signed
          path: |
            signed/TurboIO-local-only.ipa
            signed/report.json
          if-no-files-found: error
